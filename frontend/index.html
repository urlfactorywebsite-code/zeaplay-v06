  <!-- Theme Loader Script to prevent FOUC (Flash of Unstyled Content) -->
  <script>
    (function () {
      const storageKey = 'zenith-task-theme';
      const storedTheme = localStorage.getItem(storageKey) || 'dark';
      const root = document.documentElement;
      const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

      root.classList.remove('dark');
      root.classList.remove('theme-colorful');
      root.classList.remove('theme-light');

      const shouldUseColorful = storedTheme === 'colorful';
      const shouldUseDark =
        storedTheme === 'dark' ||
        (storedTheme === 'system' && mediaQuery.matches) ||
        (!storedTheme && mediaQuery.matches);

      if (shouldUseColorful) {
        root.classList.add('theme-colorful');
        return;
      }

      if (shouldUseDark) {
        root.classList.add('dark');
      } else {
        root.classList.add('theme-light');
      }
    })();
  </script>

    body {

        radial-gradient(120% 120% at 0% 0%, rgba(37, 99, 235, 0.10) 0%, rgba(238, 243, 249, 0) 45%),
        linear-gradient(180deg, var(--color-bg-secondary) 0%, var(--color-bg-primary) 100%);

      min-height: 100vh;
      transition: background 0.5s ease, color 0.3s ease;
      position: relative;
      overflow-x: hidden;
    }
    .dark body {
      background:
        radial-gradient(130% 130% at 18% 10%, rgba(56, 189, 248, 0.15) 0%, rgba(5, 11, 24, 0) 48%),
        radial-gradient(120% 120% at 82% 0%, rgba(139, 92, 246, 0.12) 0%, rgba(5, 11, 24, 0) 42%),
        linear-gradient(180deg, var(--color-bg-tertiary) 0%, var(--color-bg-primary) 100%);

    .theme-colorful body {

    body::before {

      inset: 0;
      pointer-events: none;

    .gantt .grid-header, .gantt .grid-row {

    }
    .gantt .grid-row:nth-child(even) {

    }
    .gantt .tick, .gantt .month-name, .gantt .task-name {

    }
    .gantt .bar-label {
        fill: #ffffff;
    }
    .dark .gantt .bar-label {
        fill: var(--color-text-primary);
    }
    .gantt .bar-progress {

    }
    .gantt .bar {

    }
    .gantt .handle {

        opacity: 0.6;
    }
    .gantt .arrow {

    }
    .confetti-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 9999;
    }
    .confetti {
        position: absolute;
        width: 8px;
        height: 16px;
        background: #f43f5e;
        top: -20px;
        opacity: 0;
        animation: confetti-fall 3s ease-out forwards;
    }
    @keyframes confetti-fall {
        0% {
            transform: translateY(0) rotateZ(0);
            opacity: 1;
        }
        100% {
            transform: translateY(100vh) rotateZ(720deg);
            opacity: 0;
        }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
    .animate-shake {
        animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
    }
</style>
