name: zeaplay_v1

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeaplay
      POSTGRES_USER: zeaplay
      POSTGRES_PASSWORD: zeaplay
    ports:
      - "7432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--port", "7379"]
    ports:
      - "7379:7379"

  backend:
    volumes:
      - backend_media:/app/media
    build:
      context: ./backend
    environment:
      VEE_DATABASE_URL: postgresql+psycopg://zeaplay:zeaplay@postgres:5432/zeaplay
      VEE_CACHE_REDIS_URL: redis://redis:7379
      VEE_JWT_SECRET_KEY: change_me
      VEE_JWT_REFRESH_SECRET_KEY: change_me_refresh
      VEE_ENVIRONMENT: development
    ports:
      - "7211:7211"
    depends_on:
      - postgres
      - redis

  presence:
    build:
      context: ./presence-server
    environment:
      PRESENCE_PORT: 7212
      PRESENCE_SESSION_VALIDATION_URL: ${PRESENCE_SESSION_VALIDATION_URL:-http://backend:7211/auth/presence/validate}
      PRESENCE_REDIS_URL: redis://redis:7379
      PRESENCE_JWT_SECRET: change_me
      PRESENCE_JWT_ALGORITHM: HS256
      PRESENCE_EVENTS_CHANNEL: presence:events
      PRESENCE_CORS_ORIGINS: http://localhost:7300,http://127.0.0.1:7300,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "7212:7212"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:7211/api
        VITE_API_URL: http://localhost:7211/api
        VITE_PRESENCE_URL: http://localhost:7212
        VITE_CHAT_URL: http://localhost:7212
    environment:
      PRESENCE_URL: http://localhost:7212
      CHAT_URL: http://localhost:7212
    ports:
      - "7300:80"
    depends_on:
      - backend
      - presence

volumes:
  backend_media:
  postgres_data:
