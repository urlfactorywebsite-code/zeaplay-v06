name: zeaplay_v1

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeaplay
      POSTGRES_USER: zeaplay
      POSTGRES_PASSWORD: zeaplay
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      VEE_DATABASE_URL: postgresql+psycopg://zeaplay:zeaplay@postgres:5432/zeaplay
      VEE_CACHE_REDIS_URL: redis://redis:6379
      VEE_JWT_SECRET_KEY: change_me
      VEE_JWT_REFRESH_SECRET_KEY: change_me_refresh
      VEE_ENVIRONMENT: development
    ports:
      - "6211:6211"
    depends_on:
      - postgres
      - redis

  presence:
    build:
      context: ./presence-server
    environment:
      PRESENCE_PORT: 6212
      PRESENCE_REDIS_URL: redis://redis:6379
      PRESENCE_JWT_SECRET: change_me
      PRESENCE_JWT_ALGORITHM: HS256
      PRESENCE_EVENTS_CHANNEL: presence:events
      PRESENCE_CORS_ORIGINS: http://localhost:6300,http://127.0.0.1:6300,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "6212:6212"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:6211/api
        VITE_API_URL: http://localhost:6211/api
        VITE_PRESENCE_URL: http://localhost:6212
        VITE_CHAT_URL: http://localhost:6212
    environment:
      PRESENCE_URL: http://localhost:6212
      CHAT_URL: http://localhost:6212
    ports:
      - "6300:80"
    depends_on:
      - backend
      - presence

volumes:
  postgres_data:
